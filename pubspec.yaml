name: crossword_puzzle
description: A fully functional crossword puzzle mobile app with Supabase backend

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  provider: ^6.1.1
  # Local Storage
  shared_preferences: ^2.2.2
  # Backend & Database
  supabase_flutter: ^2.0.0
  # Animations
  confetti: ^0.7.0
  shimmer: ^3.0.0
  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0
  # Audio
  audioplayers: ^5.2.1
  # Connectivity
  connectivity_plus: ^5.0.2
  # Date/Time
  intl: ^0.19.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/puzzles/
    # - assets/audio/
    - assets/images/

